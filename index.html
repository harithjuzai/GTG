function machinePage(b){const extra=(MACHINE_DETAILS||{})[b.id]||{};return pageHead({title:`${esc(b.id==='kba'?'KBA / Koenig & Bauer':b.name)}<br>${esc(b.id==='ryobi'?'Sheetfed presses':b.id==='rmgt'?'9 & 10 series':b.id==='komori'?'Lithrone':b.id==='heidelberg'?'Speedmaster':b.id==='mitsubishi'?'Diamond':'ROLAND presses')}`,lead:b.blurb,tag:'Sheetfed offset · '+b.from,image:b.image,caption:b.caption,contain:b.id==='heidelberg',parent:['used','Machines'],actions:enquire(b.name+' printing machines','Ask about this brand')})+`<section class="section"><div class="wrap detail-grid"><div class="detail-main"><div class="panel">${b.logo?brandLogo(b,'brand-page-logo'):''}<h3>Built for your application</h3>${list(extra.applications||b.focus)}</div><div class="panel"><h3>Series and configurations</h3><p>${esc(extra.overview||'The exact format, production speed and options depend on the model and year. Start with a suitable series, then assess the individual machine.')}</p><div class="model-list">${b.series.map(s=>`<span>${esc(s)}</span>`).join('')}</div>${extra.specs?`<h4 style="margin-top:26px">Manufacturer reference: ${esc(extra.specsTitle)}</h4><p style="margin-top:10px">${esc(extra.specsNote)}</p><table class="spec-table" style="margin-top:20px"><tbody>${extra.specs.map(s=>`<tr><th scope="row">${esc(s[0])}</th><td>${esc(s[1])}</td></tr>`).join('')}</tbody></table>`:''}${extra.features?list(extra.features):''}<p class="note">Photos illustrate GTG’s supplied machine and project portfolio. Features and technical figures apply to the named models; the pictured press may have a different specification. Confirm the exact machine and fitted options with our team.</p>${extra.sources?.length?`<details class="technical-source"><summary>Technical references</summary><p>${extra.sources.map(s=>`<a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.title)}</a>`).join('<br>')}</p></details>`:''}</div><div class="panel"><h3>Check before you choose</h3>${list(b.check)}</div></div><aside class="panel detail-aside"><span class="tag">Let’s find a match</span><h3 style="margin-top:17px">Tell us what your<br>production needs.</h3><p>We’ll help you narrow the options around the work you actually print.</p>${list(['Required sheet size and substrates','Number of colours and coating needs','Budget, timeline and preferred year range','Delivery site and installation needs'])}${enquire(b.name+' presses','Discuss your machine','small')}<div style="margin-top:23px">${link('contact','Prepare an enquiry')}</div></aside></div></section><section class="section soft"><div class="wrap">${sectionHead('Beyond the machine','Support for your '+esc(b.name)+' press.')}<div class="grid g3">${[SVC[0],SVC[1],SVC[3]].map(serviceCard).join('')}</div></div></section>${band()}`;}
pages.types=()=>pageHead({title:'Start with what<br>you need to print.',tag:'Machine configurations',lead:'The right format, colour configuration and drying system help your machine fit the jobs you run.'})+`<section class="section"><div class="wrap"><div class="grid g3">${TYPES.map(p=>configCard(p,'type')).join('')}</div></div></section>${band()}`;
pages.postpress=()=>pageHead({title:'Finish with<br>the right equipment.',tag:'Post press & converting',lead:'Build a complete workflow with die-cutting, cutting, folder-gluing, coating and other finishing equipment.',image:'pp-spot-uv',caption:'Automatic spot UV coating machine from the GTG booklet',contain:true,actions:enquire('post press equipment','Discuss finishing equipment')})+`<section class="section"><div class="wrap">${sectionHead('Complete your workflow','Equipment beyond the press.')}<div class="grid g3">${PP.map(ppCard).join('')}</div><p class="note">Our booklet shows example equipment configurations. Tell us your sheet size, material, required output and process so we can confirm a suitable machine.</p></div></section>${band()}`;
function categoryPage(p,kind){const isPP=kind==='pp', specs=isPP?(POSTPRESS_DETAILS||{})[p.id]:null;return pageHead({title:esc(p.name),tag:p.tag,lead:p.blurb,image:isPP?p.image:null,caption:isPP&&p.image?'Equipment image from the GTG booklet':'',contain:isPP,parent:[isPP?'postpress':'types',isPP?'Post press':'Machine types'],actions:enquire(p.name,'Ask about this equipment')})+`<section class="section"><div class="wrap"><div class="grid g2"><div class="panel"><h3>Typical applications</h3>${list(p.uses)}</div><div class="panel"><h3>Help us find your machine</h3>${list(p.send)}</div></div>${specs?`<div class="panel" style="margin-top:28px"><h3>${esc(specs.title||'Example configuration from our booklet')}</h3><table class="spec-table"><tbody>${specs.specs.map(s=>`<tr><th scope="row">${esc(s[0])}</th><td>${esc(s[1])}</td></tr>`).join('')}</tbody></table>${specs.features?list(specs.features):''}<p class="note">${esc(specs.note||'Brochure specification for the illustrated configuration. Confirm the model, options, material compatibility and achievable output before ordering.')}</p></div>`:''}</div></section><section class="section soft"><div class="wrap">${sectionHead('Explore more','Build your complete workflow.')}<div class="grid g3">${(isPP?PP:TYPES).filter(v=>v.id!==p.id).slice(0,3).map(v=>isPP?ppCard(v):configCard(v,'type')).join('')}</div></div></section>${band()}`;}
pages.services=()=>pageHead({title:'A team behind<br>your production.',tag:'Technical services',lead:'On-site and workshop support for printing and post press equipment. From diagnosis and repairs to relocation, installation and refurbishment.',image:'project-kba-assembly',caption:'GTG technicians working on press-unit assembly',actions:enquire('technical services','Talk to technical sales')})+`<section class="section"><div class="wrap"><div class="grid g3">${SVC.map(serviceCard).join('')}</div></div></section>${band('Keep your production moving.','Share your machine make, model and a description of the work you need. Photos or a short video help us understand the scope.')}`;
function servicePage(s){return pageHead({title:esc(s.name),tag:s.tag,lead:s.blurb,image:s.img,parent:['services','Services'],actions:enquire(s.name,'Discuss this service')})+`<section class="section"><div class="wrap"><div class="grid g2"><div class="panel"><h3>${s.steps?'How refurbishment works':'How we can help'}</h3>${s.steps?`<ol class="steps">${s.steps.map(t=>`<li><div><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p></div></li>`).join('')}</ol>`:list(s.inc||[])}</div><div class="panel"><h3>Start with your machine</h3><p>${esc(s.after)}</p>${list(['Machine make, model and serial number','Photos or a video of the condition or fault','Site location and preferred timing','Any previous repairs or relevant service history'])}${enquire(s.name,'Send an enquiry')}</div></div><div class="grid g3" style="margin-top:30px">${[s.img,...(s.img2||[])].map(n=>`<div class="card-photo" style="border-radius:4px">${photo(n,s.name)}</div>`).join('')}</div></div></section>${band()}`;}
function partCard(p){return `<div class="card part-card"><div class="card-photo">${photo(p[1],p[0]+' for '+p[2])}</div><div class="card-body"><span class="tag">${esc(p[2])}</span><h3>${esc(p[0])}</h3>${enquire(p[0]+' for '+p[2],'Ask for a quote','secondary small')}</div></div>`;}
pages.parts=()=>pageHead({title:'Small parts.<br>Big difference.',tag:'Spare parts & consumables',lead:'Electrical, mechanical and pressroom parts for leading printing brands. Share your machine model, part number and a photo so we can check the right match.',actions:enquire('spare parts and consumables','Find a part')})+`<section class="section"><div class="wrap">${sectionHead('Triple A parts grades','Options for your machine<br>and your budget.')}${gradeBlock()}</div></section><section class="section soft"><div class="wrap">${sectionHead('Our parts range','Find what keeps you running.')}<div class="toolbar"><label class="field">Search parts<input id="partSearch" type="search" placeholder="Part name or brand" autocomplete="off"></label><label class="field">Brand<select id="partBrand"><option value="all">All brands</option>${[...new Set(PARTS.map(p=>p[2]))].map(b=>`<option>${esc(b)}</option>`).join('')}</select></label><label class="field">Category<select id="partCategory"><option value="all">All categories</option><option value="elec">Electrical & electronics</option><option value="mech">Mechanical</option><option value="cons">Consumables</option></select></label></div><p id="partCount" class="result-count" aria-live="polite"></p><div id="partGrid" class="grid g4"></div><p class="note">Images show items from our range. Confirm the part number, compatibility, grade and availability with our team.</p></div></section><section class="section"><div class="wrap">${sectionHead('Specialist requirements','A closer look at the categories.')}<div class="grid g3">${PARTCATS.map(p=>configCard(p,'parts')).join('')}</div></div></section>${band('Send the part. We’ll check the match.','A clear photo of the part and its label, together with your machine make and model, is the best place to start.')}`;
function partsCategory(p){return pageHead({title:esc(p.name),tag:p.tag,lead:p.blurb,parent:['parts','Parts'],actions:enquire(p.name,'Find the right part')})+`<section class="section"><div class="wrap"><div class="grid g2"><div class="panel"><h3>What to send us</h3>${list(p.send)}</div><div class="panel"><h3>Check the specification</h3>${p.spec?`<table class="spec-table"><tbody>${p.spec.map(t=>`<tr><th scope="row">${esc(t[0])}</th><td>${esc(t[1])}</td></tr>`).join('')}</tbody></table>`:'<p>Use the machine model and serial number together with the part label to check fit and function. Our team can discuss new, alternative or used options where available.</p>'}</div></div>${p.cat?`<div class="grid g4" style="margin-top:30px">${PARTS.filter(t=>t[3].includes(p.cat)).map(partCard).join('')}</div>`:''}</div></section>${band()}`;}
pages.projects=()=>pageHead({title:'Our work.<br>In real production.',tag:'Past projects',lead:'Press installations, machine handling, technical repairs and maintenance. Explore photos from our supplied project portfolio.',image:'project-heidelberg-installation',caption:'Heidelberg installation from the GTG project portfolio'})+`<section class="section"><div class="wrap">${sectionHead('The project gallery','Machines. People. Progress.')}<div class="chips" id="projectFilters">${['All','Installation','Movers','Repair','Maintenance','Refurbishment','Press portfolio'].map((s,i)=>`<button class="chip" aria-pressed="${i===0}" data-filter="${s}">${s}</button>`).join('')}</div><p class="result-count" id="projectCount" aria-live="polite"></p><div class="grid g3" id="projectGrid"></div></div></section>${band('Planning a similar project?','Tell us your machine, the work involved and your timeline. We’ll discuss the scope, site requirements and next steps.')}`;
pages.about=()=>pageHead({title:'Your production.<br>Our commitment.',tag:'About Graphic Technology Gateway',lead:'A printing solutions partner bringing together machines, spare parts, consumables and technical services for the print and packaging industry.',image:'booklet-photo-6',caption:'The GTG team working on printing equipment'})+`<section class="section"><div class="wrap split"><div><div class="eyebrow">Complete & reliable solutions</div><h2>One partner.<br>A complete perspective.</h2><p>Graphic Technology Gateway works across the needs of a pressroom: finding equipment, supplying the parts it needs and supporting its working life with practical technical service.</p>${list(['Printing and post press machine sourcing','Parts and consumables for leading press brands','Repair, preventive maintenance and refurbishment','Relocation, installation and dismantling'])}${link('projects','See our work')}</div><div class="editorial-img">${photo('project-komori-team','GTG team carrying out installation of a Komori press')}</div></div></section><section class="section soft"><div class="wrap">${sectionHead('How we work','Start with your needs.<br>Build the right solution.')}<div class="grid g3"><div class="panel"><span class="tag">01 · Understand</span><h3 style="margin-top:18px">Your work comes first.</h3><p style="margin-top:14px">We begin with your application, equipment, budget and timing to understand what will help your production.</p></div><div class="panel"><span class="tag">02 · Recommend</span><h3 style="margin-top:18px">Make an informed choice.</h3><p style="margin-top:14px">Compare machine configurations, parts options and service scopes with the information that matters to your operation.</p></div><div class="panel"><span class="tag">03 · Support</span><h3 style="margin-top:18px">Keep moving forward.</h3><p style="margin-top:14px">Plan installation, maintenance and future parts requirements with a team that understands printing equipment.</p></div></div></div></section>${band()}`;
pages.contact=()=>pageHead({title:'Let’s move your<br>production forward.',tag:'Contact GTG',lead:'Tell us what you need. A machine model, a part number or a few clear photos can help us get the conversation started.'})+`<section class="section"><div class="wrap split" style="align-items:start"><div><div class="eyebrow">Speak to the team</div><div class="panel contact-card"><span>WhatsApp sales</span><a href="${wa('Hi GTG, I would like to discuss my printing requirements.')}" target="_blank" rel="noopener noreferrer">+60 16-296 2626 ${arrow}</a><span style="margin-top:16px">Email</span><a href="mailto:${EMAIL}">${EMAIL} ${arrow}</a><span style="margin-top:16px">Our office</span><p>75-1, Jalan Damai Niaga 1, Alam Damai,<br>56000 Cheras, Kuala Lumpur, Malaysia</p><a href="tel:+60391079777">+60 3-9107 9777</a><p>For a machine enquiry, include the required format, number of colours and budget. For parts or service, include the machine model and a photo where possible.</p></div></div><div class="panel"><h3>Prepare your enquiry</h3><p style="margin-bottom:25px">Add a few details and continue the conversation on WhatsApp.</p><form id="enquiryForm" class="contact-form"><div class="form-cols"><label class="field">Your name<input id="enquiryName" name="name" autocomplete="name" maxlength="100"></label><label class="field">Company<input id="enquiryCompany" name="company" autocomplete="organization" maxlength="120"></label></div><label class="field">I’m interested in<select id="enquiryTopic" name="topic"><option>Printing machines</option><option>Post press equipment</option><option>Spare parts & consumables</option><option>Technical repair & maintenance</option><option>Relocation & installation</option><option>Refurbishment</option></select></label><label class="field">Your requirements<textarea id="enquiryMessage" name="requirements" required maxlength="2500" placeholder="Machine brand, model, format, part number, or the work you need…"></textarea></label><button class="btn contact-submit" type="submit">Continue on WhatsApp ${arrow}</button><p class="enquiry-preview">This prepares a WhatsApp message. Review it and send it when you’re ready. You can attach photos in WhatsApp.</p></form></div></div></section><section class="section soft"><div class="wrap">${sectionHead('A few helpful answers','Before we speak.')}<details class="faq"><summary>How do I check which machines are available?</summary><p>Send your preferred brand, model, sheet size and configuration. Our team will confirm individual machines, their condition, fitted options and price.</p></details><details class="faq"><summary>What information helps identify a spare part?</summary><p>Send the machine make, model and serial number, the part number and clear photos of the part and its label. Dimensions or a drawing can help when a label is missing.</p></details><details class="faq"><summary>Can we discuss installation or a machine move?</summary><p>Yes. Share the machine list, site locations, access details and preferred dates. Our team will discuss the scope and requirements.</p></details><details class="faq"><summary>Are all machine specifications the same?</summary><p>No. Sheet format, speed, materials and options vary by model, generation and configuration. Always confirm the exact machine specification with our team.</p></details></div></section>`;
const NAV=[['used','Machines'],['postpress','Post press'],['services','Services'],['parts','Parts'],['projects','Projects'],['about','About']];
function footer(){return `<div class="wrap"><div class="footer-grid"><div><a class="brand" href="#home">${photo('logoL','GTG')}<span class="brand-name">Graphic Technology<br>Gateway</span></a><div class="footer-company">GRAPHIC TECHNOLOGY GATEWAY SDN. BHD.<small>上腾印刷包装科技有限公司<br>(1246741-X)</small></div><p>Machines, parts and technical expertise for the print and packaging industry.</p><div class="inline-mark" style="margin-top:23px" aria-hidden="true"><i></i><i></i><i></i></div></div><div><h4>Explore</h4><ul><li><a href="#used">Printing machines</a></li><li><a href="#postpress">Post press equipment</a></li><li><a href="#brands">Our brands</a></li><li><a href="#types">Machine configurations</a></li></ul></div><div><h4>Support</h4><ul><li><a href="#services">Technical services</a></li><li><a href="#parts">Parts & consumables</a></li><li><a href="#projects">Past projects</a></li><li><a href="#about">About GTG</a></li></ul></div><div><h4>Let’s talk</h4><ul><li><a href="${wa('Hi GTG, I would like to speak to sales.')}" target="_blank" rel="noopener noreferrer">+60 16-296 2626</a></li><li><a href="mailto:${EMAIL}">${EMAIL}</a></li><li><a href="tel:+60391079777">Office: +60 3-9107 9777</a></li><li><a href="#contact">Prepare an enquiry ${arrow}</a></li></ul><div class="footer-contact-address">75-1, Jalan Damai Niaga 1, Alam Damai,<br>56000 Cheras, Kuala Lumpur, Malaysia</div></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} Graphic Technology Gateway</span><span>Machines. Parts. Expertise.</span></div></div>`;}
function resolve(route){if(pages[route])return pages[route]();const m=route.match(/^(machine|brand|type|pp|svc|parts)-(.+)$/);if(m){const kind=m[1],id=m[2],arr={machine:BRANDS,brand:BRANDS,type:TYPES,pp:PP,svc:SVC,parts:PARTCATS}[kind],item=arr.find(v=>v.id===id);if(item)return ['machine','brand'].includes(kind)?machinePage(item):['type','pp'].includes(kind)?categoryPage(item,kind):kind==='svc'?servicePage(item):partsCategory(item);}return null;}
function openGallery(i){galleryIndex=i;returnFocus=document.activeElement;drawGallery();$('#lightbox').showModal();document.body.style.overflow='hidden';$('#lbClose').focus();}
function drawGallery(){const p=galleryItems[galleryIndex];$('#lbImg').src=IMG[p[0]];$('#lbImg').alt=p[1];$('#lbTitle').textContent=p[1];$('#lbDescription').textContent=p[3];$('#lbCount').textContent=`Photo ${galleryIndex+1} of ${galleryItems.length}`;}
function closeGallery(){$('#lightbox').close();document.body.style.overflow='';returnFocus?.focus();}
function wire(route){
 if($('#machineGrid')){const draw=()=>{const q=$('#machineSearch').value.toLowerCase().trim(),b=$('#machineBrand').value,items=BRANDS.filter(v=>(b==='all'||v.id===b)&&[v.name,v.blurb,...v.series,...v.focus].join(' ').toLowerCase().includes(q));$('#machineCount').textContent=`${items.length} press ${items.length===1?'family':'families'}`;$('#machineGrid').innerHTML=items.map(machineCard).join('')||`<div class="empty"><h3>Let’s find what you need.</h3><p>No families match this search. Send us your preferred model and requirements.</p>${enquire('a specific printing machine','Ask our team')}</div>`;};$('#machineSearch').addEventListener('input',draw);$('#machineBrand').addEventListener('change',draw);draw();}
 if($('#partGrid')){const draw=()=>{const q=$('#partSearch').value.toLowerCase().trim(),b=$('#partBrand').value,c=$('#partCategory').value,items=PARTS.filter(p=>(b==='all'||p[2]===b)&&(c==='all'||p[3].includes(c))&&(p[0]+' '+p[2]).toLowerCase().includes(q));$('#partCount').textContent=`${items.length} ${items.length===1?'item':'items'} in this selection`;$('#partGrid').innerHTML=items.map(partCard).join('')||`<div class="empty"><h3>Need a different part?</h3><p>Send a photo, label and your machine model so we can check.</p>${enquire('a spare part','Find my part')}</div>`;};['partSearch','partBrand','partCategory'].forEach(id=>$('#'+id).addEventListener(id==='partSearch'?'input':'change',draw));draw();}
 if($('#projectGrid')){const draw=f=>{galleryItems=PROJECT_GALLERY.filter(p=>f==='All'||p[2]===f);$('#projectGrid').innerHTML=galleryItems.map(projectCard).join('');$('#projectCount').textContent=`${galleryItems.length} project photos`;};$('#projectFilters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#projectFilters').querySelectorAll('button').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));draw(b.dataset.filter);});draw('All');}
 if(route==='home')galleryItems=PROJECT_GALLERY.slice(0,3);
 if($('#enquiryForm'))$('#enquiryForm').addEventListener('submit',e=>{e.preventDefault();let t='Hi GTG, I am interested in '+$('#enquiryTopic').value+'.';if($('#enquiryName').value.trim())t+='\nName: '+$('#enquiryName').value.trim();if($('#enquiryCompany').value.trim())t+='\nCompany: '+$('#enquiryCompany').value.trim();t+='\n\n'+$('#enquiryMessage').value.trim();window.open(wa(t),'_blank','noopener,noreferrer');});
}
let disposeExperience=()=>{},disposeCorporate=()=>{};
function render(){disposeExperience();disposeCorporate();if($('#lightbox').open)closeGallery();let route=location.hash.slice(1)||'home';if(route==='main'){location.hash='home';return;}let content=resolve(route);if(!content){route='home';content=pages.home();}$('#main').innerHTML=content;const active=route.startsWith('svc-')?'services':route.startsWith('parts-')?'parts':route.startsWith('pp-')?'postpress':['used','brands','types'].includes(route)||/^(machine|brand|type)-/.test(route)?'used':route;$('#mainNav').innerHTML=NAV.map(([r,l])=>`<a href="#${r}"${r===active?' aria-current="page"':''}>${l}</a>`).join('');$('#mainNav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#menuBtn').textContent='Menu';const title=($('#main h1')?.innerText||'Graphic Technology Gateway').replace(/\s+/g,' ');document.title=route==='home'?'Graphic Technology Gateway | Complete & Reliable':title+' | Graphic Technology Gateway';wire(route);window.scrollTo(0,0);disposeExperience=window.GTGExperience.mount($('#main'));disposeCorporate=window.GTGCorporateMotion.mount($('#main'));}
$('#headerLogo').src=IMG.logoL;$('#floatingWa').href=wa('Hi GTG, I would like to speak to your sales team.');$('#footer').innerHTML=footer();
$('#menuBtn').addEventListener('click',()=>{const open=$('#mainNav').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',String(open));$('#menuBtn').textContent=open?'Close ×':'Menu';});
$('#skipLink').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView();});
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-gallery-index]');if(b)openGallery(Number(b.dataset.galleryIndex));});
$('#lbClose').addEventListener('click',closeGallery);$('#lbPrev').addEventListener('click',()=>{galleryIndex=(galleryIndex-1+galleryItems.length)%galleryItems.length;drawGallery();});$('#lbNext').addEventListener('click',()=>{galleryIndex=(galleryIndex+1)%galleryItems.length;drawGallery();});
$('#lightbox').addEventListener('close',()=>{document.body.style.overflow='';returnFocus?.focus();});$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))closeGallery();});document.addEventListener('keydown',e=>{if($('#lightbox').open){if(e.key==='ArrowLeft')$('#lbPrev').click();if(e.key==='ArrowRight')$('#lbNext').click();}else if(e.key==='Escape'){const menuWasOpen=$('#mainNav').classList.contains('open');if(menuWasOpen)$('#menuBtn').focus();$('#mainNav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#menuBtn').textContent='Menu';}});
window.addEventListener('hashchange',()=>{render();$('#main').focus({preventScroll:true});});render();
})();
</script><noscript><div class="wrap section"><h1>Graphic Technology Gateway</h1><p>Enable JavaScript to browse machines, parts and projects. Contact us at <a href="mailto:sales@gtgateway.com">sales@gtgateway.com</a> or <a href="https://wa.me/60162962626">+60 16-296 2626</a>.</p></div></noscript></body></html>
